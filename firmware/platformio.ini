; PlatformIO Project Configuration File for ESP32 Solar Intelligence Gateway
; Target Board: ESP32-WROOM-32 (Dual Core 240MHz, 4MB Flash)

[platformio]
default_envs = esp32_solar_gateway

[env:esp32_solar_gateway]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; Flash Partition Table: 4MB Flash with 1.5MB LittleFS partition for offline telemetry buffer
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs

; Build Flags: Optimize performance, enable FreeRTOS tasks and configure TLS
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DMBEDTLS_NET_C
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=1

; Production-Grade Libraries
lib_deps = 
    4-20ma/ModbusMaster@^2.0.1
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17
    vshymanskyy/TinyGSM@^0.11.7

; Automated LittleFS filesystem build
extra_scripts = pre:extra_script.py
